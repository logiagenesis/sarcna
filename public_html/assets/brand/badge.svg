<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="SARCNA 2027 badge">
  <title>SARCNA 2027 — Cape Winelands Convention badge</title>
  <defs>
    <clipPath id="sarcnaBadgeClip"><circle cx="60" cy="60" r="45"/></clipPath>
    <linearGradient id="sarcnaSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6E7"/>
      <stop offset="55%" stop-color="#F7E3C0"/>
      <stop offset="100%" stop-color="#E9C98F"/>
    </linearGradient>
    <linearGradient id="sarcnaSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2C263"/>
      <stop offset="100%" stop-color="#D9A441"/>
    </linearGradient>
    <linearGradient id="sarcnaField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8DA98F"/>
      <stop offset="100%" stop-color="#173D2F"/>
    </linearGradient>
  </defs>

  <!-- Circle of fellowship: the outer ring holds everything together -->
  <circle cx="60" cy="60" r="58" fill="#173D2F"/>
  <circle cx="60" cy="60" r="52.5" fill="none" stroke="#D9A441" stroke-width="1.4" opacity="0.85"/>
  <circle cx="60" cy="60" r="48.5" fill="none" stroke="#D9A441" stroke-width="0.6" opacity="0.45"/>

  <g clip-path="url(#sarcnaBadgeClip)">
    <rect x="10" y="15" width="100" height="90" fill="url(#sarcnaSky)"/>

    <!-- Sunrise -->
    <circle cx="60" cy="58" r="15" fill="url(#sarcnaSun)"/>
    <g stroke="#D9A441" stroke-width="1.1" stroke-linecap="round" opacity="0.55">
      <line x1="60" y1="33" x2="60" y2="27"/>
      <line x1="42" y1="40" x2="38" y2="35"/>
      <line x1="78" y1="40" x2="82" y2="35"/>
      <line x1="33" y1="56" x2="27" y2="56"/>
      <line x1="87" y1="56" x2="93" y2="56"/>
    </g>

    <!-- Cape mountain silhouettes -->
    <path d="M10 66 L26 47 L37 58 L48 41 L63 63 L72 53 L84 66 L96 55 L110 68 L110 106 L10 106 Z" fill="#3D6152" opacity="0.55"/>
    <path d="M10 72 L28 55 L44 70 L58 52 L74 70 L90 58 L110 76 L110 106 L10 106 Z" fill="#2A4A3C"/>

    <!-- Vineyard rows converging into a path: the road of recovery -->
    <path d="M10 106 L52 74 L58 74 L34 106 Z" fill="url(#sarcnaField)" opacity="0.95"/>
    <path d="M110 106 L68 74 L62 74 L86 106 Z" fill="url(#sarcnaField)" opacity="0.95"/>
    <path d="M60 74 L74 106 L46 106 Z" fill="#FFF6E7" opacity="0.92"/>
    <g stroke="#0E241C" stroke-width="0.9" opacity="0.35">
      <line x1="55" y1="76" x2="30" y2="106"/>
      <line x1="50" y1="80" x2="20" y2="106"/>
      <line x1="65" y1="76" x2="90" y2="106"/>
      <line x1="70" y1="80" x2="100" y2="106"/>
    </g>
  </g>

  <circle cx="60" cy="60" r="45" fill="none" stroke="#0E241C" stroke-width="2.5"/>
</svg>
